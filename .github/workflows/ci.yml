name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: procurement
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:test@localhost:3306/procurement
      NEXTAUTH_SECRET: ci-only-ci-only-ci-only-ci-only-32chars
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: Validate schema
        run: npx prisma validate

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -proot --silent 2>/dev/null; then exit 0; fi
            echo "mysql not ready yet… ($i)"
            sleep 2
          done
          echo "mysql never came up"; exit 1

      - name: Prisma db push (CI schema sync)
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Playwright E2E
        run: npm run test:e2e
        continue-on-error: true    # Playwright is advisory until we lock the fixture seed in CI

      - name: Upload build artefact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .next/
            !.next/cache/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true   # Audit is advisory in CI — PRs still land; weekly job fails loud.

  sbom:
    name: SBOM + license report
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --prefer-offline --no-audit

      - name: Generate CycloneDX SBOM (JSON + XML)
        run: |
          mkdir -p sbom
          npx -y @cyclonedx/cyclonedx-npm@2.0.0 \
            --omit=dev --output-format=json --output-file=sbom/sbom.cdx.json
          npx -y @cyclonedx/cyclonedx-npm@2.0.0 \
            --omit=dev --output-format=xml  --output-file=sbom/sbom.cdx.xml

      - name: Generate license inventory (JSON + CSV)
        run: |
          npx -y license-checker-rseidelsohn@4.3.0 \
            --production --json --out sbom/licenses.json
          npx -y license-checker-rseidelsohn@4.3.0 \
            --production --csv  --out sbom/licenses.csv

      - name: Flag copyleft licenses (advisory)
        id: copyleft
        run: |
          echo "Scanning license report for GPL/AGPL/LGPL…"
          if grep -EqI '(GPL|AGPL|LGPL|SSPL|BUSL)' sbom/licenses.csv; then
            echo "⚠ Copyleft or source-available licenses present — review sbom/licenses.csv"
            exit 1
          else
            echo "✓ No copyleft/source-available licenses detected."
          fi
        continue-on-error: true  # Advisory in CI; weekly job fails loud.

      - name: Upload SBOM + license report
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: sbom/
          retention-days: 90
